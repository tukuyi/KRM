 GRU_edgar_jung: "埃德加·荣格"
 GRU_edgar_jung_desc: "§Y生于：§!§L1894年3月6日；巴伐利亚王国、路德维希港§!\n§Y背景：§!§L埃德加·尤利乌斯·荣格是一名法学家，也是德国“保守革命”运动中极具影响力的领军人物。一战爆发后，他志愿入伍并晋升为中尉。\n\n作为一名思想家，荣格对议会制度嗤之以鼻，认为这种制度颓废且受外国强加，剥夺了德国的民族精神。1930年，他发表了政治巨著《劣等人的统治》，主张通过建立一个由精英领导、基于基督教传统的“新帝国”来取代自由主义秩序。!\n\n§Y备注：埃德加·荣格是一位悲剧性的保守主义革命精英，他试图在激进狂热的时代守住秩序的余温，却恐怕最终将被他所蔑视并试图驯服的野兽所吞噬。§!"

 GRU_dolf_sternberger: "阿道夫·斯滕贝尔格"
 GRU_dolf_sternberger_desc: "§Y生于：§!§L1907年7月28日；德意志帝国、黑森-拿骚省威斯巴登§!\n§Y背景：§!§L阿道夫·斯滕贝尔格，当代德国政治学的奠基人之一。他早年游学于基尔、法兰克福与海德堡，研习哲学、社会学与艺术史，并于1931年在保罗·蒂利希的指导下，以研究海德格尔《存在与时间》的论文获得博士学位。\n\n斯滕贝尔格作为《法兰克福报》的编辑，展现出了知识分子的风骨。尽管他的妻子是犹太人，他仍坚持以“隐喻式”的手法撰写评论，利用寓言故事暗讽德国社会中处处存在的极端右翼思潮。\n\n他不仅是“宪法爱国主义”这一核心政治概念的创造者，更在海德堡大学的讲坛上反复强调：“政治的对象与目标，唯有和平。”\n\n作为一名兼具严谨学识与道德勇气的学者，斯滕贝尔格拒绝将政治视为单纯的权力博弈，而将其视为一种维护和平、保障自由的规范化艺术。§!\n\n§Y备注：斯滕贝尔格是理性主义与法治精神的坚定捍卫者，他终生都在试图用政治科学的围栏，将野蛮与暴戾阻绝在文明之外。§!"

 GRU_hans_haaso_von_veltheim: "汉斯·哈索·冯·费尔特海姆"
 GRU_hans_haaso_von_veltheim_desc: "§Y生于：§!§L1885年10月15日；德意志帝国、科隆§!\n§Y背景：§!§L汉斯-哈索·冯·维尔特海姆，奥斯特劳领主，是一位具有强烈神秘主义色彩的德国贵族与人类智识学者。他早年曾在梅茨军事学院研习，一战期间作为气球观察员服役并获二级铁十字勋章。然而，相比于普鲁士式的军事操练，维尔特海姆对人类心灵的深度更感兴趣。他师从人智学创始人鲁道夫·斯坦纳，并将自己的奥斯特劳城堡变成了一个汇聚全球顶尖头脑的文化圣殿，接待过包括克里希那穆提以及无数亚洲僧侣和外交官。\n\n作为一名坚定的世界主义者，维尔特海姆对保守革命的崛起保持着敏锐的警惕。他曾多次深入印度、尼泊尔及阿富汗考察，被亚洲各王室视为“精神上的盟友”。他在日记中记录的东方智慧，在战时被德国知识界视作某种“精神上的抵抗运动”。\n\n维尔特海姆既是身披铠甲的骑士，也是追求寂静的苦行僧。他那长达万卷的藏书室与对东方哲学的深刻领悟，使他成为了那个动荡时代中极少数能穿透意识形态迷雾、洞察世界本质的观察者。§!"
 GRU_karl_maria_wiligut: "卡尔·玛丽亚·维利古特"
 GRU_karl_maria_wiligut_desc: "§Y生于：§!§L1866年12月10日；奥匈帝国、维也纳§!\n§Y背景：§!§L卡尔·玛丽亚·威利古特，化名“维斯托尔”。他早年曾是奥匈帝国陆军的一名职业军官，并在一战中晋升为上校。然而，他真正的“使命”始于对日耳曼远古神学和神秘主义的狂热钻研。他自称其家族拥有数千年的血脉传承，甚至声称自己是传说中亚特兰蒂斯文明的最后幸存者和阿萨神族的后裔。\n\n尽管威利古特曾因精神疾病在萨尔茨堡神经病院度过了数年时光，但这并未阻碍他走向权力的核心。从设计著名的骷髅戒指（Totenkopfring），到将维威尔斯堡（Wewelsburg）“圣杯城堡”,再到确立“黑太阳”符号，威利古特构建了一整套诡谲的日耳曼仪式与异教信仰。\n\n威利古特在疯狂的幻觉与严谨的军事背景间游走。他试图在现代社会的废墟之上，通过符文、占星与血统研究，重构一个早已消失在洪水中的远古日耳曼帝国。§!"

