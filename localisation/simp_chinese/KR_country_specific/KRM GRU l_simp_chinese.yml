 GRU_radical_democracy: "激进民主政府"
 GRU_radical_democracy_desc: "共和国的真正主人应当是全体公民，而非职业政治家、官僚集团或少数拥有经济力量的利益集团。政府必须建立在普遍政治参与、议会责任与公民组织的基础之上，并通过宪法与选举制度保证任何阶层都无法永久垄断国家。"
 GRU_national_party: "国家党政府"
 GRU_national_party_desc: "民族国家并不是自由的对立面，而是公民共同政治生活的制度框架。国家党政府因此寻求在共和国的基础上调和个人自由、社会责任与民族团结，使自由主义不再只是少数资产阶级的政治传统，而成为整个民族的共同事业。"
 GRU_national_union: "人民联合政府"
 GRU_national_union_desc: "人民联合政府试图建立一个超越旧有政治阵营的民族联合。它并不要求人民放弃自身的社会利益，而是要求不同阶层承认彼此都是国家共同体不可分割的一部分。工人、农民、中产阶级、企业家与知识分子将在共同的共和国框架下合作，以政治妥协取代阶级战争，以国家团结取代党派内耗。"
 GRU_freedom_for_all: "人人享自由"
 GRU_freedom_for_all_desc: "政治权利、结社自由、劳动者的组织权与社会参与扩大至整个人民。无论其财富、职业与社会地位如何，每一个公民都应当拥有作为国家主人的权利；共和国的任务不是保护少数人的自由，而是让自由真正成为所有人的共同财产。"
 GRU_working_class_charter: "工人宪章"
 GRU_working_class_charter_desc: "德国自由主义长期以来最大的矛盾之一，是它宣称人人平等，却无法使工人在经济与政治生活中真正拥有与资本相称的力量。工人宪章试图弥补这一缺陷：承认工人组织、集体谈判、劳动保障与政治平等，并使工人能够通过自由工会和民主制度维护自身利益。它并不要求阶级专政，而是希望通过民主使工人摆脱被动地位，使劳动者成为共和国中拥有完整权利的公民。"
 GRU_radicalism_spirit_idea: "激进主义精神"
 GRU_radicalism_spirit_idea_desc: "激进主义从来不满足于仅仅修补旧制度。它继承1848年民主派对于人民主权、政治自由与公民平等的信念，同时将这些原则延伸至现代工业社会。对于德国激进派而言，改革并不是对旧秩序进行装饰，而是不断扩大自由、民主与社会参与的范围，使共和国真正成为人民自己的国家。"
 GRU_economy_democracy_idea: "经济民主"
 GRU_economy_democracy_idea_desc: "政治民主若在工厂大门前结束，那么它便仍然是不完整的民主。经济民主主张通过工会、行业组织、职工代表与其他民主机构，使劳动者能够参与影响自身生活的经济决策。它并不必然要求消灭私人企业或市场，而是试图限制经济权力转化为政治权力，使资本与劳动能够在制度化的协商中共同参与国家经济生活。"
 GRU_srg_swr_united: "黑红金-黑白红联合"
 GRU_srg_swr_united_desc: "两个德国的旗帜曾经代表两个彼此竞争的国家观念：黑红金象征共和国与1848年的自由传统，黑白红则承载着帝国时代的民族与国家传统。如今，两种旗帜被同时悬挂，并不意味着共和国向帝制复辟，也不意味着旧帝国传统被原封不动地接受；它代表的是一种政治和解——让那些仍然珍视帝国时代国家传统的人，与忠于共和国宪法的人，共同承认德国民族国家的延续。"
 GRU_liberal_volkspartei_idea: "自由主义的人民党"
 GRU_liberal_volkspartei_idea_desc: "旧式自由主义曾经依靠城市资产阶级、知识分子与地方名流维持政治影响，却始终难以成为真正意义上的全民政治。新的国家党则试图改变这一传统：它不再把工人视为自由主义的天然敌人，而是主动争取劳动者、职员、小业主与中产阶级，使自由主义从一种社会阶层的政治纲领转变为整个人民的民主事业。"
 GRU_nation_economy_cooperation: "国家经济合作"
 GRU_nation_economy_cooperation_desc: "现代经济已经庞大到无法仅依靠个人之间的自由竞争维持稳定，也不可能通过国家命令消灭所有利益冲突。国家经济合作因此寻求第三条道路：让工会、企业、合作社、行业组织与国家机关在法律框架内协调经济政策。国家负责制定公平的规则，而社会团体负责表达各自利益；经济秩序由协商而非强制建立，市场与社会责任也因此能够并存。"
 GRU_legacy_1848_idea: "1848革命的遗产"
 GRU_legacy_1848_idea_desc: "1848年的革命虽然没有建立一个统一而自由的德国，却留下了一项未完成的政治遗产：人民主权、宪法、议会、普遍公民权以及一个由公民共同决定自身命运的民族国家。新共和国将自己视为这一事业的继承者。它不再把1848年的民主要求限制在有产阶级之内，而试图让工人与普通劳动者同样成为那场未完成革命的继承人。"
 GRU_european_radicalism: "泛欧激进主义"
 GRU_european_radicalism_desc: "民族国家曾经是自由主义争取人民主权的重要工具，却也成为世界大战的战场。泛欧激进主义因此试图把1848年的自由主义理想进一步扩大：如果德国人应当成为自己国家的主人，那么法国人、意大利人、波兰人以及其他欧洲民族同样如此。欧洲统一并非建立新的帝国，而是让各民族在平等与民主的基础上共同建立和平秩序，使民族自由最终成为欧洲和平的基础。"
 GRU_anti_party_system: "反对政党体制"
 GRU_anti_party_system_desc: "政党原本是人民组织政治意志的工具，却可能逐渐变成凌驾于人民之上的政治机器。公民只有加入某个组织、接受既定纲领，才能真正参与国家政治。反对政党体制并不意味着反对民主，而是试图寻找一种能够绕过职业党派与金钱政治、直接从基层公民生活中产生政治意志的新制度。"
 GRU_good_neighbourhood: "好邻居，好骑士"
 GRU_good_neighbourhood_desc: "国家并非由孤立的个人与遥远的官僚机关组成，而应当建立在真实存在的共同体之上。“邻里”因此成为政治生活的基本单位。居住在同一社区的人们彼此认识、共同讨论地方事务，并通过层层代表将自己的意志带入国家政治。一个真正的骑士并非只会服从命令，而应当对自己的邻人、社区与国家承担责任；公民精神也正是在这种日常共同生活中形成。"
 GRU_voluntary_service_idea: "志愿服务"
 GRU_voluntary_service_idea_desc: "国家并不只能依靠官僚机构解决社会问题。青年德意志运动主张通过志愿劳动服务，使失业青年与普通公民直接参与公共建设、土地改良、社区工程与社会救济。志愿服务既是经济困难时期的一种社会动员方式，也是公民教育的一部分：人们不是作为国家机器中的被管理者参加劳动，而是作为共同体成员主动为自己的邻里与国家服务。"
 GRU_volksstaat_idea: "人民之邦"
 GRU_volksstaat_idea_desc: "人民之邦的构想试图以邻里取代政党机器，重新设计德国国家意志的产生方式。每一个居住区都成为公民组织与选举的基本单位，再由地方、地区、邦直至帝国逐级形成政治代表，使国家权力自下而上地产生。国家不再是与人民相对立的官僚实体，而是人民自身组织起来的政治共同体——“国家就是我们”。"
 GRU_frankreich_overture: "法兰克和解"
 GRU_frankreich_overture_desc: "几代德国人都被告知，莱茵河两岸的民族注定彼此为敌。然而如果德国希望摆脱战争与复仇的循环，就必须首先同法国和解，追溯我们历史源头。曾经成为战争边界的莱茵河，如今应当成为欧洲合作的纽带。"
